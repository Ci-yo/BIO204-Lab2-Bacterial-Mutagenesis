name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Rebuild calculations
        run: Rscript scripts/calculate_mutation_frequencies.R
      - name: Validate repository
        run: Rscript scripts/validate_repository.R
